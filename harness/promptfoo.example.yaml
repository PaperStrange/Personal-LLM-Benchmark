# ============================================================
# EXAMPLE ONLY - NOT RUNNABLE AS-IS.
# Copy to promptfoo.yaml, fill in your providers, then run:
#     promptfoo eval --repeat 3
# ============================================================

description: "LLM workflow eval pack - example multi-harness matrix"

# One provider per (harness, model) tuple you want to compare.
# Screening tier: GPT-6 Luna is $0.10/$0.50 per MTok - run it everywhere first.
providers:
  # OpenAI models via the Codex SDK (uses your Codex subscription / API key)
  - id: codex:gpt-6-luna
    label: "codex / gpt-6-luna (screening)"
  - id: codex:gpt-6-sol
    label: "codex / gpt-6-sol (finalist)"

  # Claude models via the Claude Agent SDK
  - id: claude-agent-sdk:claude-fable-5
    label: "claude-code / fable-5 (finalist)"

  # Any-model via the OpenCode SDK - swap the model string to re-run the
  # same harness against a new release without changing anything else
  - id: opencode:gpt-6-luna
    label: "opencode / gpt-6-luna (screening)"
  # - id: opencode:gpt-6-sol
  #   label: "opencode / gpt-6-sol (finalist)"

# The three task prompts. Each provider runs each prompt.
prompts:
  - file://tasks/T1-global-review.md
  - file://tasks/T2-multi-agent.md
  - file://tasks/T3-expandability.md

# Assertions: rubric grading + hard budget/latency gates.
defaultTest:
  assert:
    # LLM-as-judge against the pack's rubrics (swap per prompt in `tests`
    # below if you split configs per task; kept simple here on purpose)
    - type: llm-rubric
      value: "Grade this candidate output strictly against the rubric criteria."
    # Hard gates: kill a run that blows the budget or hangs
    - type: cost
      threshold: 2.00 # USD per eval - raise only for deliberate deep runs
    - type: latency
      threshold: 600000 # ms (10 min) - long-horizon tasks need headroom

# NOTE on repeats: agent runs are non-deterministic. --repeat 3 is the
# minimum for development; 5-10 per task for production decisions.
# Track pass@k (can it solve it at all?) and pass^k (can you trust it?).
# Cheaper alternative: run the pack through judge/jev_judge.py, which grades
# one candidate output at a time for a fraction of a cent per rubric.
